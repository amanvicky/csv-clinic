[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-clinic"
version = "0.1.0"
description = "Diagnose and clean messy CSVs from the terminal - inspect, fix, convert. Zero dependencies"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aman Elugam" }]

[project.scripts]
csv-clinic = "csv_clinic:main"
